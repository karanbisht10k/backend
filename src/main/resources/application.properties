server.port=8080

# App properties
app.frontend-url=http://localhost:5173
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:8080
app.token-encryptor-password=${TOKEN_ENCRYPTOR_PASSWORD:codesense-dev-secret-password-12345}
app.token-encryptor-salt=${TOKEN_ENCRYPTOR_SALT:a1b2c3d4e5f60718}
app.indexing.max-file-bytes=102400
app.indexing.chunk-size=800
app.github.token=${GITHUB_TOKEN:}

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/devpilot}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Spring AI OpenAI / NVIDIA NIM Configuration
spring.ai.openai.base-url=${AI_BASE_URL:https://integrate.api.nvidia.com}
spring.ai.openai.api-key=${NVIDIA_API_KEY:${OPENAI_API_KEY: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}}
spring.ai.openai.chat.options.model=${AI_MODEL:minimaxai/minimax-m3.1-flash}
spring.ai.vectorstore.pgvector.initialize-schema=false

# GitHub OAuth2 Configuration
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:dummy-client-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:dummy-client-secret}
spring.security.oauth2.client.registration.github.scope=read:user,repo

# Logging
logging.level.devPilot.backend=INFO
logging.level.org.springframework.web=INFO
